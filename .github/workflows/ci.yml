name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both runners install dtc, because the round-trip tests compare our
        # output against it. Keeping the comparison on both platforms is what
        # catches endianness and alignment differences that a single runner
        # would hide.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dtc
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install dtc
          else
            sudo apt-get update
            sudo apt-get install -y device-tree-compiler
          fi

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain versions
        run: |
          moon version --all
          moonc -v
          dtc --version

      - name: Update dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check
        run: moon check --deny-warn

      - name: Test
        run: moon test

      - name: Regenerate fixtures and confirm they still match
        run: ./tools/gen-fixtures.sh --check

      # Byte-identical output is the project's central claim, and a backend
      # difference would break it silently: the wasm-gc and native builds get
      # the same source, but the JavaScript one runs under node and sees a
      # different argv. Compiling the same fixture on each and comparing
      # against the checked-in blob catches that class of divergence.
      - name: Every backend produces the same blob
        run: |
          for target in wasm-gc js native; do
            moon build --target "$target" --release
            moon run --target "$target" cmd/main -- \
              internal/fixtures/realview-pb1176.pre.dts -o "/tmp/$target.dtb"
            cmp "/tmp/$target.dtb" internal/fixtures/realview-pb1176.dtb
            echo "$target: byte-identical"
          done

      - name: Browser module decodes and re-emits a blob
        run: |
          ./tools/build-web.sh
          node --input-type=module -e "
            import { decompile_blob, compile_source } from './web/dist/wasm.js';
            import { readFileSync } from 'node:fs';
            const enc = new TextEncoder();
            const dec = new TextDecoder();

            const blob = new Uint8Array(readFileSync('internal/fixtures/realview-pb1176.dtb'));
            const got = dec.decode(decompile_blob(blob));
            const want = readFileSync('internal/fixtures/realview-pb1176.expected.dts', 'utf8');
            if (got !== want) { console.error('browser module output differs'); process.exit(1); }
            console.log('browser module: decompile byte-identical');

            // The compile direction is the one a browser cannot get from dtc,
            // so it gets the same comparison the native CLI gets. The source is
            // the preprocessed fixture, which is what the CLI compiles too.
            const src = readFileSync('internal/fixtures/realview-pb1176.pre.dts', 'utf8');
            const mine = compile_source(enc.encode(src));
            if (mine[0] === 0x21) {
              console.error('compile_source returned: ' + dec.decode(mine));
              process.exit(1);
            }
            const ref = new Uint8Array(readFileSync('internal/fixtures/realview-pb1176.dtb'));
            if (mine.length !== ref.length) {
              console.error('compile_source length ' + mine.length + ', dtc ' + ref.length);
              process.exit(1);
            }
            for (let i = 0; i < ref.length; i++) {
              if (mine[i] !== ref[i]) {
                console.error('compile_source differs at byte ' + i);
                process.exit(1);
              }
            }
            console.log('browser module: compile byte-identical');

            // A malformed source has to come back as a message, not an
            // exception across the module boundary: the page reads the first
            // byte to decide which it got.
            const bad = compile_source(enc.encode('/dts-v1/; / { broken'));
            if (bad[0] !== 0x21) {
              console.error('bad source did not return an error message');
              process.exit(1);
            }
            console.log('browser module: errors are reported as text');
          "